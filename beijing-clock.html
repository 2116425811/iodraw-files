<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北京时间</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .clock {
      text-align: center;
      letter-spacing: 0.08em;
    }
    .label {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 10px;
    }
    .time {
      font-size: clamp(44px, 10vw, 88px);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="clock" aria-live="polite">
    <div class="label">北京时间 (UTC+8)</div>
    <div id="time" class="time">--:--:--</div>
  </main>
  <script>
    const formatter = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const timeEl = document.getElementById("time");
    const update = () => {
      timeEl.textContent = formatter.format(new Date());
    };

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
